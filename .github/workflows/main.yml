name: Build Whisper GGML Models

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

# One release build at a time. A second run that starts while another is still
# building waits for it instead of racing it for the same draft release.
concurrency:
  group: whisper-models-release
  cancel-in-progress: false

jobs:
  create-release:
    timeout-minutes: 7200
    runs-on: [self-hosted, Linux, X64, beast-unit]
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      whispercpp-version: ${{ steps.get-whispercpp-version.outputs.version }}
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          ref: v1.7.6

      - name: Extract whisper.cpp version
        id: get-whispercpp-version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          elif [ -d .git ]; then
            VERSION=$(git describe --tags --abbrev=0)
          else
            VERSION="unknown"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create version tag
        id: create-tag
        run: |
          # Date plus UTC time, for every trigger. A day-only tag made a push and the
          # weekly schedule on the same day reuse one tag, so the second run could
          # redraft or overwrite an already published release.
          VERSION=$(date -u +'%Y.%m.%d.%H%M')
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.create-tag.outputs.tag }}
          name: "Whisper GGML Models ${{ steps.create-tag.outputs.tag }}"
          body: |
            # Whisper GGML Models Release ${{ steps.create-tag.outputs.tag }}

            This release contains GGML-converted Whisper models for use with whisper.cpp and compatible applications.

            ## Models Included
            - **ggml-base.bin** - Base model (~150MB)
            - **ggml-small.bin** - Small model (~500MB)
            - **ggml-medium.bin** - Medium model (~1.5GB)
            - **ggml-large-v3.bin** - Large v3 model (~3GB, split into parts due to GitHub size limits)
            - **ggml-silero-v5.1.2.bin** - Silero VAD v5.1.2 voice-activity model for the whisper.cpp `vad_model` option (~0.9MB, MIT license, from [ggml-org/whisper-vad](https://huggingface.co/ggml-org/whisper-vad))

            Every asset is listed with its SHA-256 in `manifest.json`, signed as `manifest.json.sig`.

            ## Usage
            These models can be used directly with:
            - [whisper.cpp](https://github.com/ggml-org/whisper.cpp)
            - [whisper-desktop](https://github.com/Const-me/Whisper)
            - Any application supporting GGML Whisper models

            ## How to Reassemble the Large Model
            After downloading all parts (e.g., `ggml-large-v3.bin.part-aa`, `ggml-large-v3.bin.part-ab`, ...), run the following command in the folder with the parts:

            **Linux / macOS (Terminal):**
            ```sh
            cat ggml-large-v3.bin.part-* > ggml-large-v3.bin
            ```

            **Windows (Command Prompt):**
            ```cmd
            copy /b ggml-large-v3.bin.part-aa+ggml-large-v3.bin.part-ab+ggml-large-v3.bin.part-ac ggml-large-v3.bin
            ```
            *(Add all part filenames in order, separated by `+`.)*

            **Windows (PowerShell):**
            ```powershell
            Get-Content .\ggml-large-v3.bin.part-* -Raw | Set-Content .\ggml-large-v3.bin -AsByteStream
            ```

            ## Build Information
            - Built from: whisper.cpp ${{ steps.get-whispercpp-version.outputs.version }}
            - Source models: OpenAI Whisper (HuggingFace), Silero VAD (ggml-org/whisper-vad, MIT)
            - Build date: ${{ steps.create-tag.outputs.tag }}

            Generated automatically by GitHub Actions.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-base:
    needs: create-release
    uses: ./.github/workflows/build-model.yml
    with:
      model_name: "base"
      model_repo: "openai/whisper-base"
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      release_tag : ${{ needs.create-release.outputs.tag }}

  build-small:
    needs: create-release
    uses: ./.github/workflows/build-model.yml
    with:
      model_name: "small"
      model_repo: "openai/whisper-small"
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      release_tag : ${{ needs.create-release.outputs.tag }}

  build-medium:
    needs: create-release
    uses: ./.github/workflows/build-model.yml
    with:
      model_name: "medium"
      model_repo: "openai/whisper-medium"
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      release_tag : ${{ needs.create-release.outputs.tag }}

  build-large-v3:
    needs: create-release
    uses: ./.github/workflows/build-model.yml
    with:
      model_name: "large-v3"
      model_repo: "openai/whisper-large-v3"
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      release_tag : ${{ needs.create-release.outputs.tag }}

  # The silero voice-activity model whisper.cpp uses for its `vad_model` option. The
  # media server fetches it from this release next to the whisper models, by asset
  # name `ggml-silero-v5.1.2`, and only when the signed manifest lists it. It is not
  # converted here but fetched from a pinned revision and checked against a pinned
  # digest, so a changed upstream file fails the run instead of shipping unnoticed.
  add-vad-model:
    timeout-minutes: 30
    needs: create-release
    runs-on: [self-hosted, Linux, X64, beast-unit]
    env:
      VAD_FILE: ggml-silero-v5.1.2.bin
      # whisper.cpp v1.9.1's models/download-vad-model.sh fetches this file from
      # ggml-org/whisper-vad; the revision pins the exact blob that script resolved
      # to on 2026-10-21.
      VAD_URL: https://huggingface.co/ggml-org/whisper-vad/resolve/9ffd54a1e1ee413ddf265af9913beaf518d1639b/ggml-silero-v5.1.2.bin
      VAD_SHA256: 29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf
      VAD_SIZE: "885098"
    steps:
      - name: Download the silero VAD model from its pinned revision
        run: |
          rm -rf vad && mkdir -p vad
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --output "vad/${VAD_FILE}" "${VAD_URL}"

      - name: Verify the digest and size
        run: |
          ACTUAL_SIZE=$(stat -c%s "vad/${VAD_FILE}")
          if [ "${ACTUAL_SIZE}" != "${VAD_SIZE}" ]; then
            echo "::error::${VAD_FILE} is ${ACTUAL_SIZE} bytes, expected ${VAD_SIZE}"
            exit 1
          fi
          echo "${VAD_SHA256}  vad/${VAD_FILE}" | sha256sum --check --strict
          echo "${VAD_FILE}: ${ACTUAL_SIZE} bytes, sha256 ${VAD_SHA256}"

      - name: Upload the VAD model to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" "vad/${VAD_FILE}" \
            --repo "${{ github.repository }}" --clobber

  sign:
    timeout-minutes: 7200
    needs: [create-release, build-base, build-small, build-medium, build-large-v3, add-vad-model]
    runs-on: [self-hosted, Linux, X64, beast-unit]
    permissions:
      contents: write
    steps:
      - name: Download model assets from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf release && mkdir -p release
          gh release download "${{ needs.create-release.outputs.tag }}" \
            --repo "${{ github.repository }}" --dir release --pattern '*.bin*'

      - name: Check that every expected asset is present
        run: |
          # The manifest only lists what was downloaded, so a missing asset would
          # otherwise ship inside a validly signed manifest without anyone noticing.
          missing=0
          for f in ggml-base.bin ggml-small.bin ggml-medium.bin ggml-large-v3.bin.part-aa ggml-silero-v5.1.2.bin; do
            if [ ! -f "release/$f" ]; then
              echo "::error::release asset $f is missing"
              missing=1
            fi
          done
          [ "$missing" = "0" ]
          ls -l release

      - name: Generate signed manifest
        uses: NoMercy-Entertainment/nomercy-media-server/.github/actions/generate-release-manifest@master
        with:
          output-dir: release
          version: ${{ needs.create-release.outputs.tag }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload manifest and signature to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            release/manifest.json release/manifest.json.sig \
            --repo "${{ github.repository }}" --clobber

  publish-release:
    timeout-minutes: 7200
    needs: [create-release, build-base, build-small, build-medium, build-large-v3, add-vad-model, sign]
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
