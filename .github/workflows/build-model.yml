name: Build Single Whisper GGML Model

on:
  workflow_call:
    inputs:
      model_name:
        required: true
        type: string
        description: "Name of the model (e.g., base, small, medium, large-v3)"
      model_repo:
        required: true
        type: string
        description: "HuggingFace repository path (e.g., openai/whisper-base)"
      release_upload_url:
        required: true
        type: string
        description: "GitHub release upload_url for direct asset upload"
      release_tag:
        required: true
        type: string
        description: "GitHub release tag for direct asset upload"

jobs:
  build-model:
    timeout-minutes: 7200
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      # No disk-cleanup step here on purpose. The job runs on a persistent self-hosted
      # host, where jlumbroso/free-disk-space would strip toolchains, Docker images and
      # swap that other workloads rely on. The checkout below wipes the job workspace,
      # and the runner's own job-completed hook cleans up after the job.
      - name: Checkout whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          ref: v1.7.6

      - name: Download mel filters
        run: |
          # Ensure the whisper assets directory exists and download mel filters
          mkdir -p ${{ github.workspace }}/whisper/assets
          if [ ! -f "${{ github.workspace }}/whisper/assets/mel_filters.npz" ]; then
            echo "Downloading mel_filters.npz..."
            wget -O "${{ github.workspace }}/whisper/assets/mel_filters.npz" \
              "https://raw.githubusercontent.com/openai/whisper/main/whisper/assets/mel_filters.npz" || \
            curl -L -o "${{ github.workspace }}/whisper/assets/mel_filters.npz" \
              "https://raw.githubusercontent.com/openai/whisper/main/whisper/assets/mel_filters.npz"
          fi

      - name: Install dependencies
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          sudo apt-get update && sudo apt-get install -y git-lfs wget python3 python3-pip python3-venv
          git lfs install
          # The runner's system Python is externally managed (PEP 668) and refuses
          # pip installs, so the conversion toolchain lives in a per-job venv.
          VENV_DIR="${RUNNER_TEMP}/whisper-venv"
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          echo "${VENV_DIR}/bin" >> "$GITHUB_PATH"
          "${VENV_DIR}/bin/pip" install --upgrade pip
          "${VENV_DIR}/bin/pip" install numpy tqdm torch --index-url https://download.pytorch.org/whl/cpu
          "${VENV_DIR}/bin/pip" install transformers
          mkdir -p ${{ github.workspace }}/models-src ${{ github.workspace }}/output/models

      - name: Download HuggingFace model ${{ inputs.model_name }}
        run: |
          # For large models, use sparse checkout to avoid downloading unnecessary files
          MODEL_DIR="${{ github.workspace }}/models-src/${{ inputs.model_name }}"

          for i in {1..3}; do
            rm -rf "$MODEL_DIR"
            mkdir -p "$MODEL_DIR"
            cd "$MODEL_DIR"

            if git clone --filter=blob:none --no-checkout https://huggingface.co/${{ inputs.model_repo }} .; then
              # Configure sparse checkout to exclude large unnecessary files
              git sparse-checkout init --cone
              git sparse-checkout set --no-cone
              echo "/*" > .git/info/sparse-checkout
              echo "!flax_model.msgpack" >> .git/info/sparse-checkout
              echo "!tf_model.h5" >> .git/info/sparse-checkout
              if git checkout; then
                break
              else
                cd ${{ github.workspace }}
                rm -rf "$MODEL_DIR"
                if git clone --depth 1 https://huggingface.co/${{ inputs.model_repo }} "$MODEL_DIR"; then
                  break
                fi
              fi
            fi

            echo "Attempt $i failed, retrying..."
            cd ${{ github.workspace }}
            rm -rf "$MODEL_DIR"
            sleep $((i * 5))  # Progressive backoff: 5s, 10s, 15s
          done

      - name: Convert model to GGML ${{ inputs.model_name }}
        run: |
          python3 ${{ github.workspace }}/models/convert-h5-to-ggml.py \
            ${{ github.workspace }}/models-src/${{ inputs.model_name }} \
            ${{ github.workspace }} \
            ${{ github.workspace }}/output/models/
          if [ -f "${{ github.workspace }}/output/models/ggml-model.bin" ]; then
            mv "${{ github.workspace }}/output/models/ggml-model.bin" \
               "${{ github.workspace }}/output/models/ggml-${{ inputs.model_name }}.bin"
          fi
          echo "Cleaning up ${{ inputs.model_name }} source files..."
          rm -rf ${{ github.workspace }}/models-src/${{ inputs.model_name }}

      - name: Upload GGML model ${{ inputs.model_name }}
        uses: actions/upload-artifact@v7
        with:
          name: whisper-ggml-model-${{ inputs.model_name }}
          path: output/models/ggml-${{ inputs.model_name }}.bin

      - name: Split large model if needed
        if: ${{ inputs.model_name == 'large-v3' }}
        run: |
          split -b 2000M output/models/ggml-large-v3.bin output/models/ggml-large-v3.bin.part-

      - name: Set upload pattern
        id: set-upload-pattern
        run: |
          if [ "${{ inputs.model_name }}" = "large-v3" ]; then
            echo "pattern=output/models/ggml-large-v3.bin.part-*" >> $GITHUB_OUTPUT
          else
            echo "pattern=output/models/ggml-${{ inputs.model_name }}.bin" >> $GITHUB_OUTPUT
          fi

      - name: Upload model(s) to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading ${{ steps.set-upload-pattern.outputs.pattern }} to release"
          gh release upload "${{ inputs.release_tag }}" ${{ steps.set-upload-pattern.outputs.pattern }} --repo "${{ github.repository }}" --clobber
        shell: bash

      # Optionally, still upload as workflow artifact for redundancy
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ggml-${{ inputs.model_name }}
          path: ${{ steps.set-upload-pattern.outputs.pattern }}
